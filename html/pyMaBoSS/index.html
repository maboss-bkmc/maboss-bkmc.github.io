<h3>pyMaBoSS</h3>

Python interface for the MaBoSS software

<h4>Installation</h4>

<h5>With conda</h5>
<pre>conda install -c colomoto pymaboss</pre>

<h5>With pip</h5>

<pre>pip install maboss</pre>
<pre>python -m maboss_setup</pre>

<h4>Documentation</h4>

The documentation is available <a href="https://pymaboss.readthedocs.io/">here</a>
